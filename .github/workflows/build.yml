name: Build and verify plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codementor-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, verify, and package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Gradle Wrapper launcher
        run: echo "76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle Wrapper execution
        run: chmod +x gradlew

      - name: Test, verify, and build plugin
        run: ./gradlew clean test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: CodeMentor-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
