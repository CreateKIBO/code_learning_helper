# ===== CodeMentor 构建配置 =====
# 参考 IntelliJ Platform Gradle Plugin 2.x 官方文档：
# https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html

# ---- 目标 IDE 版本（你的本机版本）----
# IDEA 2024.1.1，build 号 241，JBR 17
platformVersion=2024.1.1

# ---- 插件元信息 ----
pluginGroup=com.codementor
pluginName=CodeMentor
pluginVersion=0.6.0-SNAPSHOT
# 兼容范围：仅支持 2024.1.x（241.*），不跨大版本
pluginSinceBuild=241
pluginUntilBuild=241.*

# ---- 构建性能优化（官方推荐）----
# 用 JBR（JetBrains Runtime）跑构建，避免本地 JDK 与平台 JBR 版本不一致
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

# ---- 避免 daemon 缓存锁冲突 ----
# 曾出现 "Cannot lock checksums cache" 错误，根因是命令行 --no-daemon 与 IDEA daemon
# 混用导致 .gradle/checksums 抢锁。已通过统一用 daemon 模式 + 清理项目级 .gradle 解决。
# 关闭文件监听可减少 Gradle 后台对 .gradle 的占用，进一步降低锁竞争概率。
org.gradle.vfs.watch=false
